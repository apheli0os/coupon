# Redis 主节点：开启 AOF、声明宿主机可达地址（哨兵切换后客户端要能连上）
bind 0.0.0.0
protected-mode no
port 6379
appendonly yes
appendfsync everysec
requirepass mallRedis2026
masterauth mallRedis2026
maxmemory 256mb
maxmemory-policy allkeys-lru
# 关键：宿主机 JVM 通过 host.docker.internal:映射端口 访问
replica-announce-ip host.docker.internal
replica-announce-port 16381
