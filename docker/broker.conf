# RocketMQ Broker 本地开发配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 允许自动创建 topic / 消费组，仅用于本地开发
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

namesrvAddr = namesrv:9876
listenPort = 10911

# 应用跑在宿主机时，broker 回连地址必须能被宿主机访问
# 若应用也在容器内，请改为宿主机真实 IP 或对应的服务名
brokerIP1 = 127.0.0.1
