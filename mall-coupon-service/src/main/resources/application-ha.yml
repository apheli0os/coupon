# 高可用 profile：Redis 哨兵 + MySQL 主从 + Kafka 3 副本
# 激活：--spring.profiles.active=ha
# 前提：docker compose -f docker-compose-ha.yml up -d
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: public
        fail-fast: false
  datasource:
    # 写主库；读分离由 ShardingSphere 的 -Psharding + ha 组合承担，
    # 此处直连主库保证领取/核销这类写后读的强一致
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13308/mall_coupon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
  data:
    redis:
      # 哨兵模式：不配 host/port，交给 sentinel 发现主节点
      sentinel:
        master: mallredis
        nodes: ${REDIS_SENTINELS:127.0.0.1:26381,127.0.0.1:26382,127.0.0.1:26383}
      password: ${REDIS_PASSWORD:mallRedis2026}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:19092,127.0.0.1:19093,127.0.0.1:19094}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

# Sentinel 流控规则由 Nacos 动态下发；关闭时回退到 SentinelConfig 的本地规则
sentinel:
  nacos:
    enabled: ${SENTINEL_NACOS_ENABLED:false}
    server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    group-id: MALL_SENTINEL_GROUP
    data-id: ${SENTINEL_DATA_ID:coupon-sentinel-flow.json}
