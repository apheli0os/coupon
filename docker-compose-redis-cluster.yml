    restart: unless-stopped
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-mallRedis2026} --masterauth ${REDIS_PASSWORD:-mallRedis2026} --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      redis-cluster-net:
        ipv4_address: 172.29.0.14
    mem_limit: 320m

  redis-5:
    image: redis:7.2-alpine
    container_name: mall-redis-cluster-5
    restart: unless-stopped
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-mallRedis2026} --masterauth ${REDIS_PASSWORD:-mallRedis2026} --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      redis-cluster-net:
        ipv4_address: 172.29.0.15
    mem_limit: 320m

  redis-6:
    image: redis:7.2-alpine
    container_name: mall-redis-cluster-6
    restart: unless-stopped
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-mallRedis2026} --masterauth ${REDIS_PASSWORD:-mallRedis2026} --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      redis-cluster-net:
        ipv4_address: 172.29.0.16
    mem_limit: 320m

networks:
  redis-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
