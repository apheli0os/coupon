# Alertmanager 本地路由：按 severity 分级
# 生产环境替换 receiver 为真实 webhook（企业微信 / 钉钉 / PagerDuty）
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'app']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - receiver: 'critical'
      matchers: ['severity = "critical"']
      repeat_interval: 30m
    - receiver: 'warning'
      matchers: ['severity = "warning"']

receivers:
  - name: 'default'
    # 本地无 webhook 时用 null 接收器（告警进 UI，不外发）；生产替换
    webhook_configs: []
  - name: 'critical'
    webhook_configs: []
  - name: 'warning'
    webhook_configs: []

inhibit_rules:
  - source_matchers: ['alertname = "ServiceDown"']
    target_matchers: ['severity != "critical"']
    equal: ['instance']
