apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-gateway
  namespace: mall
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mall-gateway
  template:
    metadata:
      labels:
        app: mall-gateway
    spec:
      containers:
        - name: mall-gateway
          image: registry.example.com/mall/gateway:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mall-common-config
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: mall-gateway
  namespace: mall
spec:
  selector:
    app: mall-gateway
  ports:
    - port: 8080
      targetPort: 8080
