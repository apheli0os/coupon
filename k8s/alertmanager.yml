# Alertmanager 路由配置：按 severity 分级，生产替换 webhook 地址
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'app']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - receiver: 'critical'
      matchers:
        - severity = "critical"
      repeat_interval: 30m
    - receiver: 'warning'
      matchers:
        - severity = "warning"

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://alertmanager-webhook.mall.svc.cluster.local:8080/notify'
        send_resolved: true
  - name: 'critical'
    webhook_configs:
      - url: 'http://alertmanager-webhook.mall.svc.cluster.local:8080/notify'
        send_resolved: true
  - name: 'warning'
    webhook_configs:
      - url: 'http://alertmanager-webhook.mall.svc.cluster.local:8080/notify'
        send_resolved: true

inhibit_rules:
  # 服务整体下线时，抑制该实例上的其他告警，避免告警风暴
  - source_matchers: ['alertname = "ServiceDown"']
    target_matchers: ['severity != "critical"']
    equal: ['instance']
