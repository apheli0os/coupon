apiVersion: v1
kind: Service
metadata:
  name: coupon-service
  namespace: mall
spec:
  selector:
    app: coupon-service
  ports:
    - port: 8081
      targetPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: seckill-service
  namespace: mall
spec:
  selector:
    app: seckill-service
  ports:
    - port: 8082
      targetPort: 8082

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: mall
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083

---
# 秒杀服务按 CPU 自动扩容，大促时提高 maxReplicas
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seckill-service-hpa
  namespace: mall
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seckill-service
  minReplicas: 4
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---
# 唯一入口：网关层完成鉴权与限流，业务 Service 不对外暴露
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mall-gateway-ingress
  namespace: mall
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: mall.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mall-gateway
                port:
                  number: 8080
