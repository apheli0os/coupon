  template:
    metadata:
      labels:
        app: seckill-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: seckill-service
          image: registry.example.com/mall/seckill-service:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: mall-common-config
          env:
            - name: DB_URL
