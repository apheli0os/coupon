# 生产级高可用增强清单（多机 K8s 集群使用，本地 8GB 环境不部署）
# 用法：kubectl apply -f k8s/ha-production-addon.yaml
# 前提：已 apply namespace-configmap.yaml + deployments.yaml + services-hpa-ingress.yaml
# 增强点：Pod 反亲和（跨节点打散）+ PDB（主动驱逐保护）+ NetworkPolicy（东西向隔离）

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coupon-service-pdb
  namespace: mall
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: coupon-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seckill-service-pdb
  namespace: mall
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: seckill-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: mall
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: order-service
---
# 默认拒绝跨命名空间直连业务服务：
# 1) 8081~8083 仅允许同 mall 命名空间内（网关/微服务互调）访问；
# 2) mall-gateway 的 8080 允许来自 ingress-nginx 命名空间与同命名空间访问。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mall-backend-same-namespace-only
  namespace: mall
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mall-gateway-ingress-allow
  namespace: mall
spec:
  podSelector:
    matchLabels:
      app: mall-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# 示例：给秒杀 Deployment 打反亲和补丁所需的拓扑分布约束，直接 apply 到已有 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-service-ha
  namespace: mall
spec:
  replicas: 4
  selector:
    matchLabels:
      app: seckill-service-ha
  template:
    metadata:
      labels:
        app: seckill-service-ha
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - seckill-service-ha
              topologyKey: kubernetes.io/hostname
      containers:
        - name: seckill-service
          image: registry.example.com/mall/seckill-service:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: mall-common-config
          env:
            - name: WORKER_ID
              value: "auto"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_URL
              value: "jdbc:mysql://mysql.mall.svc.cluster.local:3306/mall_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mall-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mall-db-secret
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
