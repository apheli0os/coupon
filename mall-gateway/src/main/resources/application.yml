server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: public
        fail-fast: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-route
          uri: lb://mall-coupon-service
          predicates:
            - Path=/api/auth/**
        - id: coupon-claim-route
          uri: lb://mall-coupon-service
          predicates:
            - Path=/api/coupon/claim/**
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: couponServiceCb
                fallbackUri: forward:/fallback/coupon
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
        - id: coupon-route
          uri: lb://mall-coupon-service
          predicates:
            - Path=/api/coupon/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 150
                redis-rate-limiter.burstCapacity: 300
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: couponServiceCb
                fallbackUri: forward:/fallback/coupon
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
        - id: seckill-buy-route
          uri: lb://mall-seckill-service
          predicates:
            - Path=/api/seckill/*/buy
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: seckillServiceCb
                fallbackUri: forward:/fallback/seckill
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
        - id: seckill-route
          uri: lb://mall-seckill-service
          predicates:
            - Path=/api/seckill/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 150
                redis-rate-limiter.burstCapacity: 300
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: seckillServiceCb
                fallbackUri: forward:/fallback/seckill
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
        - id: order-route
          uri: lb://mall-order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: orderServiceCb
                fallbackUri: forward:/fallback/order
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
      default-filters:
        - RemoveRequestHeader=Cookie
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

mall:
  jwt:
    secret: ${JWT_SECRET:mall-coupon-platform-default-secret-key-2026}

management:
  endpoints:
    web:
      exposure:
        # 严禁暴露 gateway 端点（GlobalFilter 不拦截 Actuator，暴露会允许无鉴权篡改路由）
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
